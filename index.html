<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=./main/index.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToB - Technology On Business</title>
    <link rel="icon" type="image/webp" href="./imagenes/Miniatura/Miniatura.webp">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0e14;
            overflow: hidden;
        }
        .loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0e14;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loader-logo {
            width: 120px;
            height: auto;
            animation: spin 1.2s linear infinite;
        }
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <script>
        window.location.replace("./main/index.html");
    </script>
</head>
<body>
    <!-- Pantalla de Carga ToB -->
    <div id="loader-wrapper" class="loader-wrapper">
        <img src="./imagenes/IsotipoColor.webp" alt="Cargando ToB..." class="loader-logo" width="4096" height="4096">
    </div>
</body>
</html>
